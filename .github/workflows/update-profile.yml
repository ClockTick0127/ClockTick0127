name: Update profile

# 포트폴리오 사이트의 projects.json 을 읽어 README와 SVG를 다시 만들고,
# 바뀐 게 있을 때만 커밋합니다.
on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 (KST)
  workflow_dispatch: # Actions 탭에서 "Run workflow"로 바로 실행
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: scripts/.fonts
          key: fonts-${{ hashFiles('scripts/build.py') }}
          restore-keys: fonts-

      - name: Install dependencies
        run: pip install fonttools==4.68.0 brotli==1.2.1

      - name: Build
        run: python scripts/build.py

      - name: Commit if changed
        run: |
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "프로필 자동 갱신"
          git push
